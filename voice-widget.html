  <button class="hlva-launcher" id="hlva-launcher" aria-label="Open voice assistant" aria-expanded="false">
    <span class="hlva-launcher-glow"></span>
    <svg class="hlva-launcher-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" />
      <path d="M19 11a7 7 0 01-14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <path d="M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    <svg class="hlva-launcher-close" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

  <!-- Expanded panel -->
  <div class="hlva-panel" id="hlva-panel" role="dialog" aria-label="Voice assistant">

    <div class="hlva-header">
      <div class="hlva-blob"></div>
      <div class="hlva-header-row">
        <span class="hlva-brand-title">Voice Assistant</span>
        <span class="hlva-brand-status">
          <span class="hlva-status-dot" id="hlva-status-dot"></span>
          <span id="hlva-status-label">Ready</span>
        </span>
      </div>
      <div class="hlva-orb-wrap">
        <div class="hlva-orb" id="hlva-orb"></div>

    </div>

    <div class="hlva-transcript" id="hlva-transcript">
      <div class="hlva-empty" id="hlva-empty">
        Ask me about our hours, location, or services — I'm listening whenever you're ready.

    <div class="hlva-footer">
      <button class="hlva-mic-btn" id="hlva-mic-btn" aria-label="Start speaking">
        <span class="hlva-mic-ring"></span>
        <span class="hlva-mic-icon" id="hlva-mic-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" />
            <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </span>
        <span class="hlva-mic-bars" id="hlva-mic-bars" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>

      <span class="hlva-hint" id="hlva-hint">Tap to speak</span>

</div>

<style>
  .hlva-widget {
    --hlva-bg: #100C18;
    --hlva-surface: #1B1524;
    --hlva-surface-soft: #221B2E;
    --hlva-accent: #EC4899;
    --hlva-accent-2: #8B5CF6;
    --hlva-gradient: linear-gradient(135deg, #F472B6 0%, #C026D3 45%, #7C3AED 100%);
    --hlva-text: #F4F1F8;
    --hlva-text-muted: #9C93AC;
    --hlva-border: rgba(255, 255, 255, 0.08);
    --hlva-radius-lg: 26px;
    --hlva-radius-md: 16px;
    --hlva-shadow: 0 30px 70px -20px rgba(124, 58, 237, 0.45), 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    --hlva-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999999;
    font-family: var(--hlva-font);
    -webkit-font-smoothing: antialiased;
  }

  .hlva-widget * {
    box-sizing: border-box;
  }

  /* ---------- Launcher ---------- */
  .hlva-launcher {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1px solid var(--hlva-border);
    background: var(--hlva-surface);
    color: #F4F1F8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 10px 30px -8px rgba(124, 58, 237, 0.5);
    transition: transform 0.2s cubic-bezier(.2, .8, .2, 1);
  }

  .hlva-launcher-glow {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: var(--hlva-gradient);
    opacity: 0.55;
    filter: blur(14px);
    z-index: -1;
  }

  .hlva-launcher:hover {
    transform: translateY(-2px) scale(1.03);
  }

  .hlva-launcher:active {
    transform: translateY(0) scale(0.97);
  }

  .hlva-launcher:focus-visible {
    outline: 2px solid var(--hlva-accent);
    outline-offset: 3px;
  }

  .hlva-launcher-icon,
  .hlva-launcher-close {
    width: 24px;
    height: 24px;
    position: absolute;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .hlva-launcher-close {
    opacity: 0;
    transform: rotate(-45deg) scale(0.7);
  }

  .hlva-widget.hlva-open .hlva-launcher-icon {
    opacity: 0;
    transform: rotate(45deg) scale(0.7);
  }

  .hlva-widget.hlva-open .hlva-launcher-close {
    opacity: 1;
    transform: rotate(0) scale(1);
  }

  /* ---------- Panel ---------- */
  .hlva-panel {
    position: absolute;
    bottom: 78px;
    right: 0;
    width: 340px;
    max-width: calc(100vw - 40px);
    background: var(--hlva-surface);
    border-radius: var(--hlva-radius-lg);
    box-shadow: var(--hlva-shadow);
    border: 1px solid var(--hlva-border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(12px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(.2, .8, .2, 1);
  }

  .hlva-widget.hlva-open .hlva-panel {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ---------- Header / blob art ---------- */
  .hlva-header {
    position: relative;
    padding: 18px 18px 14px;
    background: var(--hlva-bg);
    overflow: hidden;
  }

  .hlva-blob {
    position: absolute;
    width: 220px;
    height: 220px;
    top: -90px;
    right: -70px;
    background:
      radial-gradient(circle at 30% 30%, rgba(244, 114, 182, 0.9), transparent 60%),
      radial-gradient(circle at 65% 60%, rgba(124, 58, 237, 0.85), transparent 55%),
      radial-gradient(circle at 40% 70%, rgba(192, 38, 211, 0.7), transparent 60%);
    filter: blur(28px);
    opacity: 0.85;
    pointer-events: none;
  }

  .hlva-header-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1;
  }

  .hlva-brand-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--hlva-text);
    letter-spacing: -0.01em;
  }

  .hlva-brand-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--hlva-text-muted);
  }

  .hlva-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #34D399;
    flex-shrink: 0;
  }

  .hlva-status-dot.hlva-dot-listening {
    background: var(--hlva-accent);
    animation: hlva-blink 1s ease-in-out infinite;
  }

  .hlva-status-dot.hlva-dot-speaking {
    background: var(--hlva-accent-2);
    animation: hlva-blink 1s ease-in-out infinite;
  }

  @keyframes hlva-blink {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.35;
    }
  }

  .hlva-orb-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    padding: 18px 0 4px;
    z-index: 1;
  }

  .hlva-orb {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--hlva-gradient);
    box-shadow: 0 0 40px 6px rgba(192, 38, 211, 0.45);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .hlva-orb.hlva-orb-active {
    animation: hlva-orb-pulse 1.4s ease-in-out infinite;
  }

  @keyframes hlva-orb-pulse {

    0%,
    100% {
      transform: scale(1);
      box-shadow: 0 0 40px 6px rgba(192, 38, 211, 0.45);
    }

    50% {
      transform: scale(1.08);
      box-shadow: 0 0 55px 14px rgba(192, 38, 211, 0.65);
    }
  }

  /* ---------- Transcript ---------- */
  .hlva-transcript {
    flex: 1;
    max-height: 300px;
    min-height: 110px;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--hlva-surface);
  }

  .hlva-transcript::-webkit-scrollbar {
    width: 6px;
  }

  .hlva-transcript::-webkit-scrollbar-thumb {
    background: var(--hlva-border);
    border-radius: 10px;
  }

  .hlva-empty {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--hlva-text-muted);
    padding: 8px 2px;
  }

  .hlva-bubble {
    max-width: 85%;
    padding: 9px 13px;
    border-radius: var(--hlva-radius-md);
    font-size: 13.5px;
    line-height: 1.45;
    animation: hlva-rise 0.2s ease;
  }

  @keyframes hlva-rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hlva-bubble-user {
    align-self: flex-end;
    background: var(--hlva-gradient);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .hlva-bubble-agent {
    align-self: flex-start;
    background: var(--hlva-surface-soft);
    color: var(--hlva-text);
    border: 1px solid var(--hlva-border);
    border-bottom-left-radius: 4px;
  }

  /* ---------- Footer / mic control ---------- */
  .hlva-footer {
    padding: 14px 18px 20px;
    border-top: 1px solid var(--hlva-border);
    background: var(--hlva-surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .hlva-mic-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: var(--hlva-gradient);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.15s ease;
    box-shadow: 0 10px 30px -6px rgba(192, 38, 211, 0.65);
  }

  .hlva-mic-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1.5px solid rgba(236, 72, 153, 0.4);
    opacity: 0;
  }

  .hlva-mic-btn:hover {
    transform: scale(1.05);
  }

  .hlva-mic-btn:active {
    transform: scale(0.95);
  }

  .hlva-mic-btn:focus-visible {
    outline: 2px solid var(--hlva-accent);
    outline-offset: 3px;
  }

  .hlva-mic-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .hlva-mic-icon svg {
    width: 22px;
    height: 22px;
  }

  .hlva-mic-bars {
    position: absolute;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  .hlva-mic-bars span {
    width: 3px;
    border-radius: 2px;
    background: white;
    height: 8px;
    animation: hlva-wave 0.9s ease-in-out infinite;
  }

  .hlva-mic-bars span:nth-child(1) {
    animation-delay: 0s;
  }

  .hlva-mic-bars span:nth-child(2) {
    animation-delay: 0.1s;
  }

  .hlva-mic-bars span:nth-child(3) {
    animation-delay: 0.2s;
  }

  .hlva-mic-bars span:nth-child(4) {
    animation-delay: 0.3s;
  }

  .hlva-mic-bars span:nth-child(5) {
    animation-delay: 0.4s;
  }

  @keyframes hlva-wave {

    0%,
    100% {
      height: 6px;
    }

    50% {
      height: 18px;
    }
  }

  .hlva-mic-btn.hlva-listening .hlva-ring,
  .hlva-mic-btn.hlva-listening .hlva-mic-ring {
    animation: hlva-pulse-ring 1.6s ease-out infinite;
    opacity: 1;
  }

  .hlva-mic-btn.hlva-listening .hlva-mic-icon {
    opacity: 0;
    transform: scale(0.6);
  }

  .hlva-mic-btn.hlva-listening .hlva-mic-bars {
    display: flex;
  }

  @keyframes hlva-pulse-ring {
    0% {
      box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.45);
    }

    70% {
      box-shadow: 0 0 0 16px rgba(236, 72, 153, 0);
    }

    100% {
      box-shadow: 0 0 0 0 rgba(236, 72, 153, 0);
    }
  }

  .hlva-mic-btn.hlva-speaking {
    background: linear-gradient(135deg, #A78BFA, #7C3AED);
  }

  .hlva-hint {
    font-size: 12px;
    color: var(--hlva-text-muted);
    text-align: center;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 420px) {
    .hlva-widget {
      bottom: 16px;
      right: 16px;
    }

    .hlva-panel {
      width: calc(100vw - 32px);
    }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {

    .hlva-launcher,
    .hlva-panel,
    .hlva-bubble,
    .hlva-mic-btn,
    .hlva-mic-bars span,
    .hlva-status-dot,
    .hlva-orb {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<script>
  (function () {
    // ⚠️ REPLACE THIS with your actual n8n production webhook URL
    const WEBHOOK_URL = "https://msufyan1.app.n8n.cloud/webhook/voice-agent";

    const widget = document.getElementById("hlva-widget");
    const launcher = document.getElementById("hlva-launcher");
    const micBtn = document.getElementById("hlva-mic-btn");
    const transcriptEl = document.getElementById("hlva-transcript");
    const emptyEl = document.getElementById("hlva-empty");
    const hintEl = document.getElementById("hlva-hint");
    const statusDot = document.getElementById("hlva-status-dot");
    const statusLabel = document.getElementById("hlva-status-label");
    const orb = document.getElementById("hlva-orb");

    // ---- Panel open/close ----
    launcher.addEventListener("click", () => {
      const isOpen = widget.classList.toggle("hlva-open");
      launcher.setAttribute("aria-expanded", String(isOpen));
      if (!isOpen) {
        window.speechSynthesis.cancel();
        if (recognitionActive) recognition.stop();
      }
    });

    // ---- Speech recognition setup ----
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognitionActive = false;

    if (!SpeechRecognition) {
      micBtn.addEventListener("click", () => {
        setStatus("idle", "Voice input isn't supported in this browser. Try Chrome or Edge.");
      });
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    micBtn.addEventListener("click", () => {
      if (recognitionActive) {
        recognition.stop();
        return;
      }
      window.speechSynthesis.cancel();
      recognition.start();
    });

    recognition.addEventListener("start", () => {
      recognitionActive = true;
      micBtn.classList.add("hlva-listening");
      micBtn.classList.remove("hlva-speaking");
      orb.classList.add("hlva-orb-active");
      setStatus("listening", "Listening...");
      hintEl.textContent = "Listening — tap to stop";
    });

    recognition.addEventListener("end", () => {
      recognitionActive = false;
      micBtn.classList.remove("hlva-listening");
      orb.classList.remove("hlva-orb-active");
    });

    recognition.addEventListener("error", (event) => {
      recognitionActive = false;
      micBtn.classList.remove("hlva-listening");
      orb.classList.remove("hlva-orb-active");
      setStatus("idle", "Ready");
      hintEl.textContent = "Didn't catch that — tap to try again";
      console.error("Speech recognition error:", event.error);
    });

    recognition.addEventListener("result", async (event) => {
      const spokenText = event.results[0][0].transcript;
      addBubble("user", spokenText);
      setStatus("thinking", "Thinking...");
      hintEl.textContent = "Thinking...";

      try {
        const reply = await sendToAgent(spokenText);
        addBubble("agent", reply);
        speak(reply);
      } catch (err) {
        console.error("Agent request failed:", err);
        addBubble("agent", "Sorry, something went wrong. Please try again.");
        setStatus("idle", "Ready");
        hintEl.textContent = "Tap to speak";
      }
    });

    // ---- Helpers ----
    async function sendToAgent(message) {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      if (!response.ok) {
        throw new Error(`Webhook returned status ${response.status}`);
      }

      const data = await response.json();
      return data.reply || "Sorry, I didn't get a response.";
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1;
      utterance.pitch = 1;

      micBtn.classList.add("hlva-speaking");
      orb.classList.add("hlva-orb-active");
      setStatus("speaking", "Speaking...");
      hintEl.textContent = "Speaking...";

      utterance.onend = () => {
        micBtn.classList.remove("hlva-speaking");
        orb.classList.remove("hlva-orb-active");
        setStatus("idle", "Ready");
        hintEl.textContent = "Tap to speak";
      };

      utterance.onerror = () => {
        micBtn.classList.remove("hlva-speaking");
        orb.classList.remove("hlva-orb-active");
        setStatus("idle", "Ready");
        hintEl.textContent = "Tap to speak";
      };

      window.speechSynthesis.speak(utterance);
    }

    function addBubble(role, text) {
      if (emptyEl) emptyEl.remove();
      const bubble = document.createElement("div");
      bubble.className = "hlva-bubble " + (role === "user" ? "hlva-bubble-user" : "hlva-bubble-agent");
      bubble.textContent = text;
      transcriptEl.appendChild(bubble);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function setStatus(state, label) {
      statusLabel.textContent = label;
      statusDot.classList.remove("hlva-dot-listening", "hlva-dot-speaking");
      if (state === "listening") statusDot.classList.add("hlva-dot-listening");
      if (state === "speaking") statusDot.classList.add("hlva-dot-speaking");
    }
  })();
</script>
